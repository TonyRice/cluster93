# Scans every push and pull request for committed secrets, using the allowlist in
# .gitleaks.toml (test fixtures, documentation examples, generated files).
#
# Free for public repositories. Runs only on push/PR, so it never blocks local work.
name: secret-scan

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, so the scan covers every commit, not just the tip.
          fetch-depth: 0
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
