name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Build and test
        run: ./mvnw -B verify
      - name: Fail on JVM crash reports
        # V8 runs as native code: a crash can happen after the tests have reported success.
        run: |
          if find . -name 'hs_err_pid*.log' | grep -q .; then
            find . -name 'hs_err_pid*.log' -exec head -40 {} \;
            exit 1
          fi
      - name: Build image
        run: docker build -t automately:ci .
