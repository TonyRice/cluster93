# A three-node cluster. Each node serves the API (808x) and services' HTTP (800x); jobs run on whichever
# node is least loaded.
#   export AUTOMATELY_ADMIN_TOKEN=$(openssl rand -hex 32)   # or leave it unset: node1 then logs a generated one
#   docker compose up --build
#   curl -s -H "Authorization: Bearer $AUTOMATELY_ADMIN_TOKEN" localhost:8081/v1/nodes
#   curl -s -H 'Host: <service>--<tenant>.localhost' localhost:8001/
x-node: &node
  build: .
  environment: &env
    AUTOMATELY_CLUSTERED: "true"
    AUTOMATELY_CLUSTER_MEMBERS: node1,node2,node3
    AUTOMATELY_CAPACITY: "4"
    AUTOMATELY_MAX_HEAP_MB: "128"
    AUTOMATELY_DATA_BACKUPS: "1"
    AUTOMATELY_CLUSTER_SIZE: "3"
    AUTOMATELY_ADMIN_TOKEN: ${AUTOMATELY_ADMIN_TOKEN:-}
  healthcheck:
    test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
    interval: 5s
    retries: 12

services:
  node1:
    <<: *node
    hostname: node1
    environment: { <<: *env, AUTOMATELY_NODE_ID: node1, AUTOMATELY_CLUSTER_BIND: node1 }
    ports: ["8081:8080", "8001:8000"]
    volumes: ["node1-data:/var/lib/automately"]
  node2:
    <<: *node
    hostname: node2
    environment: { <<: *env, AUTOMATELY_NODE_ID: node2, AUTOMATELY_CLUSTER_BIND: node2 }
    ports: ["8082:8080", "8002:8000"]
    volumes: ["node2-data:/var/lib/automately"]
  node3:
    <<: *node
    hostname: node3
    environment: { <<: *env, AUTOMATELY_NODE_ID: node3, AUTOMATELY_CLUSTER_BIND: node3 }
    ports: ["8083:8080", "8003:8000"]
    volumes: ["node3-data:/var/lib/automately"]

  # docker compose --profile observability up: Prometheus scrapes the nodes, Grafana shows the Automately dashboard
  # at http://localhost:3000 (anonymous viewers; admin/admin to edit). Phase 5.
  prometheus:
    profiles: [observability]
    image: prom/prometheus:v3.5.0
    volumes: ["./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9091:9090"]
  grafana:
    profiles: [observability]
    image: grafana/grafana:12.1.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/automately.json
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]

# Each node keeps its share of the cluster's data here; `docker compose down` keeps it, `down -v` deletes it.
volumes:
  node1-data:
  node2-data:
  node3-data:
