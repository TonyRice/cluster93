openapi: 3.1.0
info:
  title: Automately API
  version: 2.0.0
  summary: Run sandboxed JavaScript jobs and services on a self-hosted cluster.
  description: |
    The REST API every Automately node serves. This file is the contract (D-046): requests are validated against
    it before any handler runs, and the test suite checks real responses against it.

    **Authentication.** Every `/v1` call carries `Authorization: Bearer <token>` (D-045). The admin token
    (`AUTOMATELY_ADMIN_TOKEN`, or generated once and logged) manages tenants and tokens only. Tenant tokens
    (`atly_…`) belong to one tenant and carry scopes; each operation lists the scope it needs. A missing or
    unknown token gets `401`, a missing scope `403`.

    **Rate limits.** Tenant requests are limited per tenant (`AUTOMATELY_RATE_LIMIT_PER_MINUTE`). Responses
    carry `RateLimit-Policy` and `RateLimit`; over the limit is `429` with `Retry-After`.

    **Errors** always look like `{"error": {"code": "…", "message": "…"}}`.
  contact:
    name: Adam & Lynn Incorporated
    email: tony@adamnlynn.com
  license:
    name: MPL-2.0
    identifier: MPL-2.0
servers:
  - url: http://localhost:8080
security:
  - bearer: []
tags:
  - name: jobs
  - name: services
  - name: files
  - name: bus
  - name: queues
  - name: tokens
  - name: admin
  - name: cluster
  - name: mcp
  - name: storage

paths:
  /health:
    get:
      operationId: getHealth
      tags: [cluster]
      summary: Liveness
      security: []
      responses:
        '200':
          description: The node is up.
          content:
            application/json:
              schema:
                type: object
                required: [status, node]
                properties:
                  status: { type: string, const: UP }
                  node: { type: string }

  /mcp:
    post:
      operationId: mcp
      tags: [mcp]
      summary: MCP over Streamable HTTP (JSON-RPC 2.0), for AI agents
      description: |
        One JSON-RPC message per request (D-047): `initialize`, `ping`, `tools/list`, `tools/call`,
        `resources/list`, `resources/read`. Answers are `application/json`; notifications get `202`. The tools act
        through this API with the caller's token, so the same scopes apply. Not validated here: JSON-RPC is its own
        protocol.
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200':
          description: A JSON-RPC response.
          content:
            application/json:
              schema: { type: object }
        '202': { description: 'A notification, accepted.' }
        default: { $ref: '#/components/responses/Error' }
    get:
      operationId: mcpStream
      tags: [mcp]
      summary: Not offered (no server-initiated stream)
      security: []
      responses:
        '405': { description: 'Only POST is offered.' }
    delete:
      operationId: mcpEndSession
      tags: [mcp]
      summary: Not offered (the server keeps no sessions)
      security: []
      responses:
        '405': { description: 'Only POST is offered.' }

  /ready:
    get:
      operationId: getReady
      tags: [cluster]
      summary: Readiness, for load balancers
      description: 200 once this node has joined the cluster (and the cluster is active); 503 with the reasons until then.
      security: []
      responses:
        '200': { $ref: '#/components/responses/Readiness' }
        '503': { $ref: '#/components/responses/Readiness' }

  /v1/openapi.json:
    get:
      operationId: getOpenApi
      tags: [cluster]
      summary: This contract, as JSON
      security: []
      responses:
        '200':
          description: The OpenAPI document.
          content:
            application/json:
              schema: { type: object }

  /v1/whoami:
    get:
      operationId: getWhoami
      tags: [tokens]
      summary: Who the token is and what it may do
      security:
        - bearer: []
      responses:
        '200':
          description: The token's identity.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Whoami' }
        default: { $ref: '#/components/responses/Error' }

  /v1/nodes:
    get:
      operationId: listNodes
      tags: [cluster]
      summary: Live nodes with capacity and load
      description: Needs `nodes:read`, or the admin token.
      security:
        - bearer: ['nodes:read']
      responses:
        '200':
          description: Live nodes, by id.
          content:
            application/json:
              schema:
                type: object
                required: [nodes]
                properties:
                  nodes:
                    type: array
                    items: { $ref: '#/components/schemas/Node' }
        default: { $ref: '#/components/responses/Error' }

  /v1/tenants:
    get:
      operationId: listTenants
      tags: [admin]
      summary: List tenants (admin)
      security:
        - bearer: [admin]
      responses:
        '200':
          description: Every tenant, by name.
          content:
            application/json:
              schema:
                type: object
                required: [tenants]
                properties:
                  tenants:
                    type: array
                    items: { $ref: '#/components/schemas/Tenant' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: createTenant
      tags: [admin]
      summary: Create a tenant (admin)
      security:
        - bearer: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { $ref: '#/components/schemas/Name' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tenant' }
        default: { $ref: '#/components/responses/Error' }

  /v1/tenants/{tenant}:
    parameters:
      - $ref: '#/components/parameters/tenant'
    get:
      operationId: getTenant
      tags: [admin]
      summary: One tenant (admin)
      security:
        - bearer: [admin]
      responses:
        '200':
          description: The tenant.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tenant' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteTenant
      tags: [admin]
      summary: Delete an empty tenant and its tokens (admin)
      description: Refused with `409` while the tenant still has services, files or kv data.
      security:
        - bearer: [admin]
      responses:
        '204': { description: 'Deleted.' }
        default: { $ref: '#/components/responses/Error' }

  /v1/tenants/{tenant}/tokens:
    parameters:
      - $ref: '#/components/parameters/tenant'
    get:
      operationId: listTenantTokens
      tags: [admin]
      summary: A tenant's tokens (admin)
      security:
        - bearer: [admin]
      responses:
        '200': { $ref: '#/components/responses/TokenList' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: createTenantToken
      tags: [admin]
      summary: Mint a token for a tenant (admin)
      security:
        - bearer: [admin]
      requestBody: { $ref: '#/components/requestBodies/TokenRequest' }
      responses:
        '201': { $ref: '#/components/responses/TokenCreated' }
        default: { $ref: '#/components/responses/Error' }

  /v1/tenants/{tenant}/tokens/{id}:
    parameters:
      - $ref: '#/components/parameters/tenant'
      - $ref: '#/components/parameters/tokenId'
    delete:
      operationId: revokeTenantToken
      tags: [admin]
      summary: Revoke a tenant's token (admin)
      security:
        - bearer: [admin]
      responses:
        '204': { description: 'Revoked.' }
        default: { $ref: '#/components/responses/Error' }

  /v1/admin/rotate:
    post:
      operationId: rotateAdminToken
      tags: [admin]
      summary: Replace a generated admin token (admin)
      description: Refused with `409` when the admin token comes from `AUTOMATELY_ADMIN_TOKEN`.
      security:
        - bearer: [admin]
      responses:
        '200':
          description: The new admin token, shown once.
          content:
            application/json:
              schema:
                type: object
                required: [token]
                properties:
                  token: { type: string }
        default: { $ref: '#/components/responses/Error' }

  /v1/tenants/{tenant}/storage-policy:
    parameters:
      - $ref: '#/components/parameters/tenant'
    get:
      operationId: getStoragePolicy
      tags: [admin, storage]
      summary: What a tenant may do with its own storage (admin)
      security:
        - bearer: [admin]
      responses:
        '200': { $ref: '#/components/responses/StoragePolicy' }
        default: { $ref: '#/components/responses/Error' }
    put:
      operationId: putStoragePolicy
      tags: [admin, storage]
      summary: Enable provider types for a tenant, give it a disk allotment, allow private endpoints (admin)
      security:
        - bearer: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                allow:
                  type: array
                  items: { type: string, enum: [s3, disk] }
                diskAllotmentMb: { type: integer, minimum: 0 }
                allowPrivateEndpoints: { type: boolean }
      responses:
        '200': { $ref: '#/components/responses/StoragePolicy' }
        default: { $ref: '#/components/responses/Error' }

  /v1/storage:
    get:
      operationId: getStorage
      tags: [storage]
      summary: 'Your storage at a glance: policy, routes, quota and disk use'
      security:
        - bearer: ['storage:read']
      responses:
        '200':
          description: An overview.
          content:
            application/json:
              schema:
                type: object
                required: [defaultBackend, policy, routes, quota, disk]
                properties:
                  defaultBackend: { type: string }
                  policy: { $ref: '#/components/schemas/StoragePolicy' }
                  routes: { $ref: '#/components/schemas/StorageRoutes' }
                  providers: { type: integer }
                  quota:
                    type: object
                    properties:
                      bytes: { type: integer }
                      usedBytes: { type: integer }
                  disk:
                    type: object
                    properties:
                      allotmentBytes: { type: integer }
                      usedBytes: { type: integer }
        default: { $ref: '#/components/responses/Error' }

  /v1/storage/providers:
    get:
      operationId: listStorageProviders
      tags: [storage]
      summary: Your storage providers (never their secrets)
      security:
        - bearer: ['storage:read']
      responses:
        '200':
          description: Providers.
          content:
            application/json:
              schema:
                type: object
                required: [providers]
                properties:
                  providers:
                    type: array
                    items: { $ref: '#/components/schemas/StorageProvider' }
        default: { $ref: '#/components/responses/Error' }

  /v1/storage/providers/{name}:
    parameters:
      - $ref: '#/components/parameters/providerName'
    get:
      operationId: getStorageProvider
      tags: [storage]
      summary: One provider
      security:
        - bearer: ['storage:read']
      responses:
        '200': { $ref: '#/components/responses/StorageProvider' }
        default: { $ref: '#/components/responses/Error' }
    put:
      operationId: putStorageProvider
      tags: [storage]
      summary: Create or update a provider; it's checked against the backend before it's saved
      description: |
        `s3`: `endpoint`, `bucket`, `accessKeyId`, and `secretAccessKey` (required when creating; omit it to keep the
        current one), optionally `region`, `prefix`, `pathStyle`. The secret is encrypted at rest and never returned.
        `disk`: no settings; the folder is chosen by the server under the admin's disk root.
      security:
        - bearer: ['storage:write']
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type: { type: string, enum: [s3, disk] }
                endpoint: { type: string }
                region: { type: string }
                bucket: { type: string }
                prefix: { type: string }
                pathStyle: { type: boolean }
                accessKeyId: { type: string }
                secretAccessKey: { type: string, writeOnly: true }
      responses:
        '200': { $ref: '#/components/responses/StorageProvider' }
        '201': { $ref: '#/components/responses/StorageProvider' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteStorageProvider
      tags: [storage]
      summary: Delete a provider that holds no files and no route points at
      security:
        - bearer: ['storage:write']
      responses:
        '204': { description: 'Deleted.' }
        default: { $ref: '#/components/responses/Error' }

  /v1/storage/providers/{name}/check:
    parameters:
      - $ref: '#/components/parameters/providerName'
    post:
      operationId: checkStorageProvider
      tags: [storage]
      summary: Check a provider can be reached with its credentials
      security:
        - bearer: ['storage:write']
      responses:
        '200':
          description: The result.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
                  error: { type: string }
        default: { $ref: '#/components/responses/Error' }

  /v1/storage/routes:
    get:
      operationId: getStorageRoutes
      tags: [storage]
      summary: Which provider new files go to
      security:
        - bearer: ['storage:read']
      responses:
        '200': { $ref: '#/components/responses/StorageRoutes' }
        default: { $ref: '#/components/responses/Error' }
    put:
      operationId: putStorageRoutes
      tags: [storage]
      summary: Set the default provider and path-prefix routes (the longest prefix wins; "default" is the cluster's own)
      security:
        - bearer: ['storage:write']
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StorageRoutes' }
      responses:
        '200': { $ref: '#/components/responses/StorageRoutes' }
        default: { $ref: '#/components/responses/Error' }

  /v1/tokens:
    get:
      operationId: listTokens
      tags: [tokens]
      summary: Your tenant's tokens
      security:
        - bearer: ['tokens:write']
      responses:
        '200': { $ref: '#/components/responses/TokenList' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: createToken
      tags: [tokens]
      summary: Mint a token for your tenant, with scopes your token also has
      security:
        - bearer: ['tokens:write']
      requestBody: { $ref: '#/components/requestBodies/TokenRequest' }
      responses:
        '201': { $ref: '#/components/responses/TokenCreated' }
        default: { $ref: '#/components/responses/Error' }

  /v1/tokens/{id}:
    parameters:
      - $ref: '#/components/parameters/tokenId'
    delete:
      operationId: revokeToken
      tags: [tokens]
      summary: Revoke one of your tenant's tokens
      security:
        - bearer: ['tokens:write']
      responses:
        '204': { description: 'Revoked; it stops working on the next request.' }
        default: { $ref: '#/components/responses/Error' }

  /v1/jobs:
    get:
      operationId: listJobs
      tags: [jobs]
      summary: Your jobs, newest first
      security:
        - bearer: ['jobs:read']
      parameters:
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Jobs.
          content:
            application/json:
              schema:
                type: object
                required: [jobs]
                properties:
                  jobs:
                    type: array
                    items: { $ref: '#/components/schemas/Job' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: submitJob
      tags: [jobs]
      summary: Run a script
      security:
        - bearer: ['jobs:write']
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [script]
              properties:
                script:
                  type: string
                  minLength: 1
                  description: An ES module whose default export receives `(input, ctx)`. At most 256 KB.
                input: { type: object }
                timeoutMs: { type: integer, minimum: 1 }
                onOrphan: { type: string, enum: [fail, retry, resume] }
                maxAttempts: { type: integer, minimum: 1, maximum: 10 }
      responses:
        '202':
          description: Accepted; the job is queued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        default: { $ref: '#/components/responses/Error' }

  /v1/jobs/{id}:
    parameters:
      - $ref: '#/components/parameters/jobId'
    get:
      operationId: getJob
      tags: [jobs]
      summary: One job, with its attempts
      security:
        - bearer: ['jobs:read']
      responses:
        '200':
          description: The job.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        default: { $ref: '#/components/responses/Error' }

  /v1/jobs/{id}/events:
    parameters:
      - $ref: '#/components/parameters/jobId'
    get:
      operationId: streamJobEvents
      tags: [jobs]
      summary: Server-sent events for a job
      description: |
        `data:` lines carry JSON events: `{"type": "log", "level", "line", "seq"}`, `{"type": "attempt", "attempt", "node",
        "previousOutcome"}`, and finally `{"type": "end", "status"}`. A finished job is replayed; a running one starts
        with the lines it has logged so far (up to 1 000), then continues live, each line once.
      security:
        - bearer: ['jobs:read']
      responses:
        '200':
          description: An event stream.
          content:
            text/event-stream:
              schema: { type: string }
        default: { $ref: '#/components/responses/Error' }

  /v1/jobs/{id}/steps:
    parameters:
      - $ref: '#/components/parameters/jobId'
    get:
      operationId: getJobSteps
      tags: [jobs]
      summary: The current attempt's checkpoint and completed steps
      security:
        - bearer: ['jobs:read']
      responses:
        '200':
          description: Checkpoint and steps.
          content:
            application/json:
              schema:
                type: object
                required: [jobId, attempt, steps]
                properties:
                  jobId: { type: string }
                  attempt: { type: integer }
                  checkpoint: {}
                  steps:
                    type: array
                    items:
                      type: object
                      required: [name, attempt, completedAt]
                      properties:
                        name: { type: string }
                        result: {}
                        attempt: { type: integer }
                        completedAt: { type: integer }
        default: { $ref: '#/components/responses/Error' }

  /v1/jobs/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/jobId'
    post:
      operationId: cancelJob
      tags: [jobs]
      summary: Cancel a job; a running one gets a graceful stop
      security:
        - bearer: ['jobs:write']
      responses:
        '202':
          description: Cancellation requested.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        default: { $ref: '#/components/responses/Error' }

  /v1/services:
    get:
      operationId: listServices
      tags: [services]
      summary: Your services
      security:
        - bearer: ['services:read']
      responses:
        '200':
          description: Services.
          content:
            application/json:
              schema:
                type: object
                required: [services]
                properties:
                  services:
                    type: array
                    items: { $ref: '#/components/schemas/Service' }
        default: { $ref: '#/components/responses/Error' }

  /v1/services/{name}:
    parameters:
      - $ref: '#/components/parameters/serviceName'
    get:
      operationId: getService
      tags: [services]
      summary: One service, with its status and hosts
      security:
        - bearer: ['services:read']
      responses:
        '200': { $ref: '#/components/responses/Service' }
        default: { $ref: '#/components/responses/Error' }
    put:
      operationId: putService
      tags: [services]
      summary: Define or update a service
      security:
        - bearer: ['services:write']
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [script]
              properties:
                script: { type: string, minLength: 1 }
                config: { type: object }
                restart: { type: string, enum: [always, on-failure] }
                enabled: { type: boolean }
      responses:
        '200': { $ref: '#/components/responses/Service' }
        '201': { $ref: '#/components/responses/Service' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteService
      tags: [services]
      summary: Stop and remove a service (releases its domains)
      security:
        - bearer: ['services:write']
      responses:
        '204': { description: 'Removed.' }
        default: { $ref: '#/components/responses/Error' }

  /v1/services/{name}/start:
    parameters:
      - $ref: '#/components/parameters/serviceName'
    post:
      operationId: startService
      tags: [services]
      summary: Start (enable) a service
      security:
        - bearer: ['services:write']
      responses:
        '200': { $ref: '#/components/responses/Service' }
        default: { $ref: '#/components/responses/Error' }

  /v1/services/{name}/stop:
    parameters:
      - $ref: '#/components/parameters/serviceName'
    post:
      operationId: stopService
      tags: [services]
      summary: Stop (disable) a service
      security:
        - bearer: ['services:write']
      responses:
        '200': { $ref: '#/components/responses/Service' }
        default: { $ref: '#/components/responses/Error' }

  /v1/services/{name}/restart:
    parameters:
      - $ref: '#/components/parameters/serviceName'
    post:
      operationId: restartService
      tags: [services]
      summary: Restart a service's current run
      security:
        - bearer: ['services:write']
      responses:
        '202': { $ref: '#/components/responses/Service' }
        default: { $ref: '#/components/responses/Error' }

  /v1/services/{name}/domains:
    parameters:
      - $ref: '#/components/parameters/serviceName'
    get:
      operationId: listDomains
      tags: [services]
      summary: A service's custom domains
      security:
        - bearer: ['services:read']
      responses:
        '200':
          description: Domains.
          content:
            application/json:
              schema:
                type: object
                required: [domains]
                properties:
                  domains:
                    type: array
                    items: { $ref: '#/components/schemas/Domain' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: claimDomain
      tags: [services]
      summary: Claim a custom domain; returns the TXT record to publish
      security:
        - bearer: ['services:write']
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain]
              properties:
                domain: { type: string, minLength: 1, maxLength: 253 }
      responses:
        '200': { $ref: '#/components/responses/Domain' }
        '201': { $ref: '#/components/responses/Domain' }
        default: { $ref: '#/components/responses/Error' }

  /v1/services/{name}/domains/{domain}:
    parameters:
      - $ref: '#/components/parameters/serviceName'
      - $ref: '#/components/parameters/domain'
    delete:
      operationId: releaseDomain
      tags: [services]
      summary: Release a custom domain
      security:
        - bearer: ['services:write']
      responses:
        '204': { description: 'Released.' }
        default: { $ref: '#/components/responses/Error' }

  /v1/services/{name}/domains/{domain}/verify:
    parameters:
      - $ref: '#/components/parameters/serviceName'
      - $ref: '#/components/parameters/domain'
    post:
      operationId: verifyDomain
      tags: [services]
      summary: Check the TXT record; the domain routes once verified
      security:
        - bearer: ['services:write']
      responses:
        '200': { $ref: '#/components/responses/Domain' }
        default: { $ref: '#/components/responses/Error' }

  /v1/files:
    get:
      operationId: listFiles
      tags: [files]
      summary: Your files, by path
      security:
        - bearer: ['files:read']
      parameters:
        - name: prefix
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
      responses:
        '200':
          description: A page of files.
          content:
            application/json:
              schema:
                type: object
                required: [files]
                properties:
                  files:
                    type: array
                    items: { $ref: '#/components/schemas/File' }
                  cursor: { type: [string, 'null'] }
        default: { $ref: '#/components/responses/Error' }

  /v1/files/{path}:
    parameters:
      - $ref: '#/components/parameters/filePath'
    get:
      operationId: getFile
      tags: [files]
      summary: Download a file, with Range and If-None-Match
      security:
        - bearer: ['files:read']
      responses:
        '200': { $ref: '#/components/responses/FileBytes' }
        '206': { $ref: '#/components/responses/FileBytes' }
        '304': { description: 'Not modified.' }
        default: { $ref: '#/components/responses/Error' }
    head:
      operationId: headFile
      tags: [files]
      summary: A file's headers (size, type, ETag)
      security:
        - bearer: ['files:read']
      responses:
        '200': { description: 'The file''s headers, no body.' }
        '304': { description: 'Not modified.' }
        default: { $ref: '#/components/responses/Error' }
    put:
      operationId: putFile
      tags: [files]
      summary: Upload a file (streamed; any size up to the quota)
      description: |
        The body is streamed to storage as it arrives and is not validated here. `413` over the tenant's quota
        (straight away when `Content-Length` is sent), `507` when the cluster is out of room.
      security:
        - bearer: ['files:write']
      requestBody:
        required: false
        content:
          application/octet-stream: {}
      responses:
        '201':
          description: Stored.
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/File' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteFile
      tags: [files]
      summary: Delete a file
      security:
        - bearer: ['files:write']
      responses:
        '204': { description: 'Deleted.' }
        default: { $ref: '#/components/responses/Error' }

  /v1/bus/{topic}:
    parameters:
      - $ref: '#/components/parameters/topic'
    post:
      operationId: publish
      tags: [bus]
      summary: Publish the JSON body to a topic
      security:
        - bearer: ['bus:publish']
      requestBody:
        required: false
        description: Any JSON; no body sends `null`.
        content:
          application/json:
            schema: {}
      responses:
        '202': { description: 'Published.' }
        default: { $ref: '#/components/responses/Error' }

  /v1/bus/{topic}/request:
    parameters:
      - $ref: '#/components/parameters/topic'
    post:
      operationId: request
      tags: [bus]
      summary: Call a topic's handler and get its reply
      security:
        - bearer: ['bus:request']
      parameters:
        - name: timeoutMs
          in: query
          schema: { type: integer, minimum: 1, maximum: 30000 }
      requestBody:
        required: false
        description: Any JSON; no body sends `null`.
        content:
          application/json:
            schema: {}
      responses:
        '200':
          description: The handler's reply.
          content:
            application/json:
              schema:
                type: object
                properties:
                  value: {}
        default: { $ref: '#/components/responses/Error' }

  /v1/queues/{queue}:
    parameters:
      - $ref: '#/components/parameters/queue'
    post:
      operationId: pushQueueMessage
      tags: [queues]
      summary: Push a message onto a durable queue (at-least-once delivery to the queue's consumers)
      security:
        - bearer: ['queues:write']
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message:
                  description: Any JSON, at most 256 KB.
                delayMs: { type: integer, minimum: 0, maximum: 604800000 }
                key:
                  type: string
                  pattern: '^[a-zA-Z0-9._-]{1,128}$'
                  description: Makes the push idempotent while a message with this key is queued.
                maxAttempts: { type: integer, minimum: 1, maximum: 20 }
      responses:
        '202':
          description: Queued.
          content:
            application/json:
              schema:
                type: object
                required: [id, queue]
                properties:
                  id: { type: string }
                  queue: { type: string }
        default: { $ref: '#/components/responses/Error' }
    get:
      operationId: getQueue
      tags: [queues]
      summary: Count a queue's messages
      security:
        - bearer: ['queues:read']
      responses:
        '200':
          description: The counts; ready includes delayed messages.
          content:
            application/json:
              schema:
                type: object
                required: [queue, ready, inFlight, dead]
                properties:
                  queue: { type: string }
                  ready: { type: integer }
                  inFlight: { type: integer }
                  dead: { type: integer }
        default: { $ref: '#/components/responses/Error' }

  /v1/queues/{queue}/dead:
    parameters:
      - $ref: '#/components/parameters/queue'
    get:
      operationId: listDeadMessages
      tags: [queues]
      summary: List messages that used up their attempts
      security:
        - bearer: ['queues:read']
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        '200':
          description: A page of dead-lettered messages.
          content:
            application/json:
              schema:
                type: object
                required: [messages]
                properties:
                  messages:
                    type: array
                    items: { $ref: '#/components/schemas/QueueMessage' }
                  cursor: { type: [string, 'null'] }
        default: { $ref: '#/components/responses/Error' }

  /v1/queues/{queue}/dead/{id}/retry:
    parameters:
      - $ref: '#/components/parameters/queue'
      - $ref: '#/components/parameters/messageId'
    post:
      operationId: retryDeadMessage
      tags: [queues]
      summary: Put a dead-lettered message back on its queue, with its attempts reset
      security:
        - bearer: ['queues:write']
      responses:
        '200':
          description: Queued again.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  status: { type: string }
        default: { $ref: '#/components/responses/Error' }

  /v1/queues/{queue}/dead/{id}:
    parameters:
      - $ref: '#/components/parameters/queue'
      - $ref: '#/components/parameters/messageId'
    delete:
      operationId: discardDeadMessage
      tags: [queues]
      summary: Delete a dead-lettered message
      security:
        - bearer: ['queues:write']
      responses:
        '204': { description: 'Deleted.' }
        default: { $ref: '#/components/responses/Error' }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: |
        `atly_…` tenant tokens, or the admin token. Scopes: `jobs:read`, `jobs:write`, `services:read`,
        `services:write`, `files:read`, `files:write`, `bus:publish`, `bus:request`, `queues:read`, `queues:write`, `tokens:write`,
        `nodes:read`, `storage:read`, `storage:write`, or `*`. Operations marked `admin` need the admin token.

  parameters:
    tenant:
      name: tenant
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Name' }
    serviceName:
      name: name
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 63 }
    tokenId:
      name: id
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    jobId:
      name: id
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    domain:
      name: domain
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 253 }
    topic:
      name: topic
      in: path
      required: true
      schema: { type: string, pattern: '^[a-zA-Z0-9._-]{1,128}$' }
    queue:
      name: queue
      in: path
      required: true
      schema: { type: string, pattern: '^[a-zA-Z0-9._-]{1,128}$' }
    messageId:
      name: id
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 200 }
    filePath:
      name: path
      in: path
      required: true
      description: A relative path; it may contain `/`, e.g. `site/index.html`.
      schema: { type: string, minLength: 1 }
    providerName:
      name: name
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 63 }
    limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 1000 }
    cursor:
      name: cursor
      in: query
      schema: { type: string }

  requestBodies:
    TokenRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name, scopes]
            properties:
              name: { type: string, minLength: 1, maxLength: 100 }
              scopes:
                type: array
                minItems: 1
                items:
                  type: string
                  enum: ['*', 'jobs:read', 'jobs:write', 'services:read', 'services:write', 'files:read', 'files:write',
                         'bus:publish', 'bus:request', 'queues:read', 'queues:write', 'tokens:write', 'nodes:read',
                         'storage:read', 'storage:write']
              expiresInDays: { type: integer, minimum: 1, maximum: 3650 }

  responses:
    Error:
      description: An error.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TokenList:
      description: Tokens, without their secrets.
      content:
        application/json:
          schema:
            type: object
            required: [tokens]
            properties:
              tokens:
                type: array
                items: { $ref: '#/components/schemas/Token' }
    TokenCreated:
      description: The token, with its secret; shown once.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Token'
              - type: object
                required: [token]
                properties:
                  token: { type: string, pattern: '^atly_[0-9A-Za-z]{49}$' }
    Readiness:
      description: Whether the node takes traffic, and why not.
      content:
        application/json:
          schema:
            type: object
            required: [status, node, reasons]
            properties:
              status: { type: string, enum: [READY, NOT_READY] }
              node: { type: string }
              reasons:
                type: array
                items: { type: string }
    StoragePolicy:
      description: A tenant's storage policy.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/StoragePolicy' }
    StorageProvider:
      description: A storage provider.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/StorageProvider' }
    StorageRoutes:
      description: Storage routes.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/StorageRoutes' }
    Service:
      description: A service.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Service' }
    Domain:
      description: A custom domain claim.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Domain' }
    FileBytes:
      description: The file's bytes (or the requested range), with the file's own Content-Type.
      headers:
        ETag:
          schema: { type: string }
        Accept-Ranges:
          schema: { type: string }
      content:
        application/octet-stream: {}

  schemas:
    QueueMessage:
      type: object
      required: [id, queue, status, attempt, maxAttempts, enqueuedAt]
      properties:
        id: { type: string }
        queue: { type: string }
        message: {}
        status: { type: string, enum: [READY, IN_FLIGHT, DEAD] }
        attempt: { type: integer }
        maxAttempts: { type: integer }
        enqueuedAt: { type: integer }
        availableAt: { type: integer }
        lastError: { type: [string, 'null'] }
    Name:
      type: string
      pattern: '^(?!.*--)[a-z0-9][a-z0-9_-]{0,62}$'
      description: Lowercase letters, digits, `_` and `-`; starts with a letter or digit; no `--`.
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: [string, integer] }
            message: { type: string }
    Whoami:
      type: object
      required: [admin]
      properties:
        admin: { type: boolean }
        tenant: { type: string }
        token: { type: string }
        scopes:
          type: array
          items: { type: string }
    StoragePolicy:
      type: object
      required: [allow, diskAllotmentMb, allowPrivateEndpoints]
      properties:
        tenant: { type: string }
        allow:
          type: array
          items: { type: string }
        diskAllotmentMb: { type: integer }
        allowPrivateEndpoints: { type: boolean }
    StorageProvider:
      type: object
      required: [id, name, type, settings, hasSecret]
      properties:
        id: { type: string }
        tenant: { type: string }
        name: { type: string }
        type: { type: string, enum: [s3, disk] }
        settings: { type: object }
        hasSecret: { type: boolean }
        createdAt: { type: integer }
        updatedAt: { type: integer }
    StorageRoutes:
      type: object
      properties:
        default: { type: string, description: 'A provider name, or "default" for the cluster''s own storage.' }
        prefixes:
          type: object
          additionalProperties: { type: string }
    Tenant:
      type: object
      required: [name, createdAt]
      properties:
        name: { type: string }
        createdAt: { type: integer }
    Token:
      type: object
      required: [id, tenant, name, scopes, createdAt]
      properties:
        id: { type: string }
        tenant: { type: string }
        name: { type: string }
        scopes:
          type: array
          items: { type: string }
        createdAt: { type: integer }
        expiresAt: { type: [integer, 'null'] }
        lastUsedAt: { type: [integer, 'null'] }
    Node:
      type: object
      required: [id, capacity, running, lastSeen]
      properties:
        id: { type: string }
        instanceId: { type: string }
        capacity: { type: integer }
        running: { type: integer }
        lastSeen: { type: integer }
        endpoint: { type: [string, 'null'] }
    Job:
      type: object
      required: [id, status, attempt, createdAt]
      properties:
        id: { type: string }
        tenant: { type: string }
        input: { type: [object, 'null'] }
        timeoutMs: { type: integer }
        onOrphan: { type: string, enum: [fail, retry, resume] }
        maxAttempts: { type: integer }
        status: { type: string, enum: [QUEUED, RUNNING, SUCCEEDED, FAILED, TIMED_OUT, ORPHANED, CANCELLED] }
        attempt: { type: integer }
        node: { type: [string, 'null'] }
        cancelRequested: { type: [boolean, 'null'] }
        service: { type: [object, 'null'] }
        output: {}
        error: { type: [string, 'null'] }
        logs:
          type: array
          items: { type: string }
        attempts:
          type: array
          items:
            type: object
            properties:
              attempt: { type: integer }
              node: { type: [string, 'null'] }
              startedAt: { type: [integer, 'null'] }
              endedAt: { type: integer }
              outcome: { type: string }
        createdAt: { type: integer }
        queuedAt: { type: [integer, 'null'] }
        startedAt: { type: [integer, 'null'] }
        finishedAt: { type: [integer, 'null'] }
    Service:
      type: object
      required: [name, status, enabled, revision, runs, hosts]
      properties:
        name: { type: string }
        script: { type: string }
        config: { type: [object, 'null'] }
        restart: { type: string, enum: [always, on-failure] }
        enabled: { type: boolean }
        completed: { type: boolean }
        status: { type: string }
        revision: { type: integer }
        currentJobId: { type: [string, 'null'] }
        currentRevision: { type: [integer, 'null'] }
        runs: { type: integer }
        consecutiveFailures: { type: integer }
        nextStartAt: { type: [integer, 'null'] }
        lastExit: { type: [object, 'null'] }
        hosts:
          type: array
          items: { type: string }
        createdAt: { type: integer }
        updatedAt: { type: integer }
    Domain:
      type: object
      required: [domain, service, verified, createdAt]
      properties:
        domain: { type: string }
        tenant: { type: string }
        service: { type: string }
        verified: { type: boolean }
        createdAt: { type: integer }
        verifiedAt: { type: [integer, 'null'] }
        verification:
          type: object
          properties:
            type: { type: string, const: TXT }
            name: { type: string }
            value: { type: string }
    File:
      type: object
      required: [path, size, contentType, etag, createdAt]
      properties:
        path: { type: string }
        size: { type: integer }
        contentType: { type: string }
        etag: { type: string }
        createdAt: { type: integer }
