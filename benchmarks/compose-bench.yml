# The demo cluster tuned for benchmarks: the locally built image, room for many isolates, no rate limit.
# A fixed, pre-touched Java heap keeps its resident size constant, so growth in a node's memory is native (isolates).
services:
  tls-init:
    image: "cluster93-bench:local"
    build: !reset null
    pull_policy: never
  node1: &bench
    image: "cluster93-bench:local"
    build: !reset null
    pull_policy: never
    environment:
      JAVA_TOOL_OPTIONS: "-Xms1g -Xmx1g -XX:+AlwaysPreTouch"
      C93_CLUSTERED: "true"
      C93_CLUSTER_MEMBERS: node1,node2,node3
      C93_CLUSTER_SIZE: "3"
      C93_DATA_BACKUPS: "1"
      C93_CAPACITY: "32"
      C93_MAX_HEAP_MB: "64"
      C93_MAX_SERVICES_PER_TENANT: "200"
      C93_RATE_LIMIT_PER_MINUTE: "0"
      C93_ADMIN_TOKEN: ${C93_ADMIN_TOKEN}
      C93_NODE_ID: node1
  node2:
    <<: *bench
    environment:
      JAVA_TOOL_OPTIONS: "-Xms1g -Xmx1g -XX:+AlwaysPreTouch"
      C93_CLUSTERED: "true"
      C93_CLUSTER_MEMBERS: node1,node2,node3
      C93_CLUSTER_SIZE: "3"
      C93_DATA_BACKUPS: "1"
      C93_CAPACITY: "32"
      C93_MAX_HEAP_MB: "64"
      C93_MAX_SERVICES_PER_TENANT: "200"
      C93_RATE_LIMIT_PER_MINUTE: "0"
      C93_ADMIN_TOKEN: ${C93_ADMIN_TOKEN}
      C93_NODE_ID: node2
  node3:
    <<: *bench
    environment:
      JAVA_TOOL_OPTIONS: "-Xms1g -Xmx1g -XX:+AlwaysPreTouch"
      C93_CLUSTERED: "true"
      C93_CLUSTER_MEMBERS: node1,node2,node3
      C93_CLUSTER_SIZE: "3"
      C93_DATA_BACKUPS: "1"
      C93_CAPACITY: "32"
      C93_MAX_HEAP_MB: "64"
      C93_MAX_SERVICES_PER_TENANT: "200"
      C93_RATE_LIMIT_PER_MINUTE: "0"
      C93_ADMIN_TOKEN: ${C93_ADMIN_TOKEN}
      C93_NODE_ID: node3
